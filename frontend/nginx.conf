server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip kompresija
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache za statičke assete (Vite dodaje hash u ime fajla)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API poziva ka api-gateway kontejneru
    # Sve /api/* rute idu na backend – ne na React router
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout za sporije endpointe (upload fotografija itd.)
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # React SPA fallback – sve ostale rute šalje na index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
