spring.application.name=api-gateway
server.port=8080

# Eureka — otkrivanje servisa
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.healthcheck.enabled=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# JWT tajni kljuc — ucitava se iz environment varijable JWT_SECRET
jwt.secret=${JWT_SECRET:FixItLocalDevKeyOnly2024NotForProd}

# Gateway interni secret — koristi se za verifikaciju da zahtjevi dolaze s gatewaya
gateway.internal-secret=${GATEWAY_SECRET:local-dev-secret}

# Iskljuci Spring Security autoconfiguration (koristimo vlastiti filter)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging
logging.level.ba.etf.fixit.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=INFO

# Reaktivni web server (Netty) — Spring Cloud Gateway zahtijeva reaktivni stack
spring.main.web-application-type=reactive